
<div class="forgot-password-container">
  <div class="card">
    <div class="card-header">
      <h2>{{ step === 1 ? 'ลืมรหัสผ่าน?' : 'ตั้งรหัสผ่านใหม่' }}</h2>
      <p class="subtitle">
        {{ step === 1 ? 'ระบุอีเมลของคุณเพื่อรับรหัส Token สำหรับกู้คืนบัญชี' : 'ระบุ Token และรหัสผ่านใหม่ที่ต้องการใช้งาน' }}
      </p>
    </div>

    <div *ngIf="message" class="alert alert-success">{{ message }}</div>
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

    <div class="card-body">
      <form *ngIf="step === 1" (ngSubmit)="onSendEmail()">
        <div class="form-group">
          <label>อีเมลที่ใช้ลงทะเบียน</label>
          <input type="email" name="email" [(ngModel)]="email" 
                 placeholder="example@mail.com" required>
        </div>
        <button type="submit" class="btn-primary" [disabled]="!email || isLoading">
          {{ isLoading ? 'กำลังส่ง...' : 'ส่งรหัสรีเซ็ต' }}
        </button>
        <div class="footer-links">
          <a (click)="setStep(2)">มีรหัส Token อยู่แล้ว?</a>
          <span class="separator">|</span>
          <a routerLink="/login">กลับไปหน้าเข้าสู่ระบบ</a>
        </div>
      </form>

      <form *ngIf="step === 2" (ngSubmit)="onResetPassword()">
        <div class="form-group">
          <label>รหัส Token</label>
          <input type="text" name="token" [(ngModel)]="token" 
                 placeholder="วางรหัสที่ได้รับจากอีเมล" required>
        </div>
        <div class="form-group">
          <label>รหัสผ่านใหม่</label>
          <input type="password" name="newPassword" [(ngModel)]="newPassword" 
                 placeholder="ระบุรหัสผ่านใหม่อย่างน้อย 8 ตัว" required>
        </div>
        <button type="submit" class="btn-primary" [disabled]="!token || !newPassword || isLoading">
          {{ isLoading ? 'กำลังประมวลผล...' : 'เปลี่ยนรหัสผ่าน' }}
        </button>
        <div class="footer-links">
          <a (click)="setStep(1)">ย้อนกลับ</a>
        </div>
      </form>
    </div>
  </div>
</div>
