
<header>
  <div class="navbar-content">
    <div class="menu-toggle" (click)="toggleMobileMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <p class="logo">Music Therapy</p>

    <nav class="nav-links">
      <a routerLink="/activity" routerLinkActive="active-nav-item" class="nav-item">หน้าหลัก</a>
      <a routerLink="/research" routerLinkActive="active-nav-item" class="nav-item">งานวิจัย</a>
      <a routerLink="/about-us" routerLinkActive="active-nav-item" class="nav-item">เกี่ยวกับเรา</a>
    </nav>

    <nav class="button">
      <ng-container *ngIf="!authService.isLoggedIn()">
        <div class="desktop-auth">
          <a routerLink="/login" class="login-btn">เข้าสู่ระบบ</a>
          <a routerLink="/register" class="register-btn">สมัครสมาชิก</a>
        </div>
      </ng-container>

      <ng-container *ngIf="authService.isLoggedIn()">
        <div class="profile-wrapper">
          <img *ngIf="user?.profile" class="profile-img" [src]="user.profile" (click)="toggleDropdown()" />
          <div *ngIf="!user?.profile" class="profile-icon" (click)="toggleDropdown()">
            <i class="fa-solid fa-user"></i>
          </div>

          <div class="dropdown" *ngIf="isDropdownOpen">
            <button *ngIf="user?.role_name === 'admin'" (click)="goToAdmin()">
              <span class="icon"><i class="fa-solid fa-gear"></i></span> จัดการระบบ
            </button>
            <button (click)="goToProfile()">
              <span class="icon"><i class="fa-solid fa-circle-user"></i></span> ข้อมูลส่วนตัว
            </button>
            <button class="logout" (click)="logout()">
              <span class="icon"><i class="fa-solid fa-arrow-right-from-bracket"></i></span> ออกจากระบบ
            </button>
          </div>
        </div>
      </ng-container>
    </nav>
  </div>

  <div class="mobile-drawer" [class.open]="isMobileMenuOpen">
    <div class="drawer-header">
      <p class="logo">Music Therapy</p>
      <i class="fa-solid fa-xmark" (click)="toggleMobileMenu()"></i>
    </div>
    
    <div class="drawer-links">
      <a routerLink="/activity" (click)="toggleMobileMenu()">หน้าหลัก</a>
      <a routerLink="/research" (click)="toggleMobileMenu()">งานวิจัย</a>
      <a routerLink="/about-us" (click)="toggleMobileMenu()">เกี่ยวกับเรา</a>
    </div>

    <div class="drawer-buttons" *ngIf="!authService.isLoggedIn()">
      <a routerLink="/login" class="mobile-login-btn" (click)="toggleMobileMenu()">เข้าสู่ระบบ</a>
      <a routerLink="/register" class="mobile-register-btn" (click)="toggleMobileMenu()">สมัครสมาชิก</a>
    </div>
  </div>

  <div class="overlay" *ngIf="isMobileMenuOpen" (click)="toggleMobileMenu()"></div>
</header>

<main class="content">
  <router-outlet></router-outlet>
</main>
